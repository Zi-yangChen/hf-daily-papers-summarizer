name: Multi-Task Daily AI Summary

on:
  schedule:
    # 每天北京时间早上 9:00 (UTC 1:00) 定时执行
    - cron: '0 1 * * *'
  workflow_dispatch: # 保留手动触发用于验证和调试

permissions:
  contents: write # 必填：授予Actions自动向代码仓库推送新文件的写权限

jobs:
  run-all-summaries:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai # 🌟 强制环境时区设为北京时间，保障文件名 YYYY-MM-DD 的准确性
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-genai

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

    # 自动将所有文件夹中的新增 Markdown 文件提交并推送到代码仓库
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || (git commit -m "Update Multi-Task Daily Summaries [skip ci]" && git push)
