name: Daily HF Papers Summary

on:
  schedule:
    # 每天 UTC 时间 01:00（北京时间早上 9:00）自动运行
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  run-summary:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai

    - name: Run script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

    # 自动将生成的 README.md 提交并同步回你的 GitHub 仓库
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git diff-index --quiet HEAD || (git commit -m "Update Daily Papers Summary [skip ci]" && git push)
